  <text x="256" y="408" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" letter-spacing="0.22em" fill="#94A3B8" text-anchor="middle">TECHNOLOGY &amp; INNOVATION STUDIO</text>
