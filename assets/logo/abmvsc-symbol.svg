<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <!-- ABMVSC Master Emblem — Interlocking Engineering, Research & Creation -->
  <defs>
    <linearGradient id="abmGradBlue" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10264B" />
    </linearGradient>
    <linearGradient id="abmGradElectric" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1677D2" />
      <stop offset="100%" stop-color="#2563EB" />
