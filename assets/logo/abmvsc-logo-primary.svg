<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none" width="100%" height="100%">
  <!-- ABMVSC Primary Logo: Symbol + Brand Typography -->
  <defs>
    <linearGradient id="primaryGrad" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10264B" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="10" y1="60" x2="60" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1677D2" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Emblem G (Scaled down to 60x60, origin 6, 6) -->
  <g transform="translate(6, 6) scale(0.6)">
    <!-- Left Primary Ascender ('A' Stroke) -->
    <path d="M50 14 L20 76 L33 76 L44 54 L56 54 L67 76 L80 76 L50 14 Z M50 36 L43 50 L57 50 Z" fill="url(#primaryGrad)" />
    <!-- Interlocking Monogram ('B' & 'M' Facets) -->
    <path d="M44 58 L50 70 L56 58 L63 72 L70 72 L50 32 L30 72 L37 72 Z" fill="url(#electricGrad)" opacity="0.9" />
    <!-- Innovation Node -->
    <polygon points="50,14 55,24 50,30 45,24" fill="#FF7900" />
    <!-- Ground Anchor -->
    <rect x="28" y="80" width="44" height="3" rx="1.5" fill="#10264B" />
  </g>

  <!-- Wordmark -->
  <text x="76" y="38" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#0B1220">ABMVSC<tspan fill="#FF7900">.</tspan></text>
  <!-- Descriptor -->
  <text x="78" y="55" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.16em" fill="#64748B">TECHNOLOGY &amp; INNOVATION STUDIO</text>
</svg>

