<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none" width="100%" height="100%">
  <!-- ABMVSC White / Dark Mode Logo -->
  <defs>
    <linearGradient id="whiteGrad" x1="10" y1="10" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="electricWhite" x1="10" y1="60" x2="60" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Emblem G -->
  <g transform="translate(6, 6) scale(0.6)">
    <path d="M50 14 L20 76 L33 76 L44 54 L56 54 L67 76 L80 76 L50 14 Z M50 36 L43 50 L57 50 Z" fill="url(#whiteGrad)" />
    <path d="M44 58 L50 70 L56 58 L63 72 L70 72 L50 32 L30 72 L37 72 Z" fill="url(#electricWhite)" opacity="0.95" />
    <polygon points="50,14 55,24 50,30 45,24" fill="#FF7900" />
    <rect x="28" y="80" width="44" height="3" rx="1.5" fill="#38BDF8" />
  </g>

  <!-- Wordmark -->
  <text x="76" y="38" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#FFFFFF">ABMVSC<tspan fill="#FF7900">.</tspan></text>
  <!-- Descriptor -->
  <text x="78" y="55" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.16em" fill="#94A3B8">TECHNOLOGY &amp; INNOVATION STUDIO</text>
</svg>

