<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10264B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1677D2"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>

  <!-- Code Grid Ring -->
  <circle cx="200" cy="200" r="190" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="200" cy="200" r="175" stroke="#FF7900" stroke-width="1.5" opacity="0.3"/>

  <!-- Developer Silhouette / Illustration -->
  <!-- Shoulders / Hoodie -->
  <path d="M70 370 C90 280 140 250 200 250 C260 250 310 280 330 370 Z" fill="url(#shirtGrad)"/>
  <path d="M150 255 L200 310 L250 255 Z" fill="#0B1220" opacity="0.25"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="55" rx="10" fill="#E2E8F0"/>

  <!-- Head -->
  <ellipse cx="200" cy="165" rx="65" ry="75" fill="#F1F5F9"/>

  <!-- Modern Hair -->
  <path d="M135 150 C130 90 180 75 225 80 C265 85 270 115 265 145 C255 120 235 110 200 110 C165 110 145 125 135 150 Z" fill="url(#hairGrad)"/>

  <!-- Minimal Glasses -->
  <rect x="150" y="150" width="40" height="26" rx="6" fill="none" stroke="#2563EB" stroke-width="4"/>
  <rect x="210" y="150" width="40" height="26" rx="6" fill="none" stroke="#2563EB" stroke-width="4"/>
  <line x1="190" y1="163" x2="210" y2="163" stroke="#2563EB" stroke-width="4"/>
  <circle cx="170" cy="163" r="4" fill="#0F172A"/>
  <circle cx="230" cy="163" r="4" fill="#0F172A"/>

  <!-- Friendly Smile -->
  <path d="M185 198 Q200 210 215 198" stroke="#64748B" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Floating Tech Badges -->
  <g transform="translate(45, 120)">
    <circle cx="20" cy="20" r="18" fill="#10264B" stroke="#2563EB" stroke-width="2"/>
    <text x="20" y="25" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(315, 120)">
    <circle cx="20" cy="20" r="18" fill="#10264B" stroke="#FF7900" stroke-width="2"/>
    <text x="20" y="26" font-family="sans-serif" font-size="14" fill="#FF7900" text-anchor="middle">⚡</text>
  </g>
</svg>

